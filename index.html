/* =========================================================================
   DATA CONTEXT — mutable in-memory store standing in for Firestore
   ========================================================================= */
const DataContext = createContext(null);
function useData(){ return useContext(DataContext); }

function DataProvider({children}){
  const [jobs, setJobs] = useState(seedJobs);
  const [categories, setCategories] = useState(CATEGORY_NAMES.map((n,i)=>({id:'cat_'+i, name:n})));
  const [cities, setCities] = useState(CITY_NAMES.map((n,i)=>({id:'city_'+i, name:n})));
  const [organizations, setOrganizations] = useState(seedOrganizations);
  const [ads, setAds] = useState(seedAds);
  const [placements, setPlacements] = useState(seedPlacements);

  function addJob(data){
    const id = uid('job');
    const job = {...data, id, slug: slugify(data.jobTitle||'وظيفة', id), createdAt: todayISO(), updatedAt: todayISO()};
    setJobs(prev => [job, ...prev]);
  }
  function updateJob(id, data){
    setJobs(prev => prev.map(j => j.id===id ? {...j, ...data, updatedAt: todayISO()} : j));
  }
  function deleteJob(id){ setJobs(prev => prev.filter(j=>j.id!==id)); }

  function addCategory(name){ setCategories(prev=>[...prev, {id:uid('cat'), name}]); }
  function deleteCategory(id){ setCategories(prev=>prev.filter(c=>c.id!==id)); }

  function addCity(name){ setCities(prev=>[...prev, {id:uid('city'), name}]); }
  function deleteCity(id){ setCities(prev=>prev.filter(c=>c.id!==id)); }

  function addOrganization(data){ setOrganizations(prev=>[...prev, {...data, id:uid('org')}]); }
  function updateOrganization(id, data){ setOrganizations(prev=>prev.map(o=>o.id===id?{...o,...data}:o)); }
  function deleteOrganization(id){ setOrganizations(prev=>prev.filter(o=>o.id!==id)); }

  function addAd(data){ setAds(prev=>[...prev, {...data, id:uid('ad')}]); }
  function updateAd(id, data){ setAds(prev=>prev.map(a=>a.id===id?{...a,...data}:a)); }
  function deleteAd(id){ setAds(prev=>prev.filter(a=>a.id!==id)); setPlacements(prev=>prev.filter(p=>p.adId!==id)); }

  function addPlacement(data){ setPlacements(prev=>[...prev, {...data, id:uid('pl')}]); }
  function deletePlacement(id){ setPlacements(prev=>prev.filter(p=>p.id!==id)); }

  const value = {
    jobs, addJob, updateJob, deleteJob,
    categories, addCategory, deleteCategory,
    cities, addCity, deleteCity,
    organizations, addOrganization, updateOrganization, deleteOrganization,
    ads, addAd, updateAd, deleteAd,
    placements, addPlacement, deletePlacement,
  };
  return <DataContext.Provider value={value}>{children}</DataContext.Provider>;
}

function ApplyModal({job, onClose}){
  const [name,setName] = useState('');
  const [phone,setPhone] = useState('');
  const [errors,setErrors] = useState({});
  const inputRef = useRef(null);
  useEffect(()=>{ inputRef.current && inputRef.current.focus(); },[]);

  function submit(e){
    e.preventDefault();
    const errs = {};
    if(!name.trim()) errs.name = "الاسم مطلوب";
    if(!phone.trim()) errs.phone = "رقم الهاتف مطلوب";
    else if(!/^[0-9+\s-]{7,15}$/.test(phone.trim())) errs.phone = "رقم الهاتف غير صحيح";
    setErrors(errs);
    if(Object.keys(errs).length) return;
    logWhatsappClick(job.id);
    const link = buildWhatsappLink(job, {name: name.trim(), phone: phone.trim()});
    window.open(link, '_blank');
    onClose();
  }

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 p-0 sm:p-4" onClick={onClose}>
      <div className="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-6 fade-up" onClick={e=>e.stopPropagation()}>
        <div className="flex items-start justify-between mb-1">
          <h3 className="font-display font-bold text-lg" style={{color:'var(--teal-900)'}}>التقديم عبر واتساب</h3>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-700 text-xl leading-none">×</button>
        </div>
        <p className="text-sm text-gray-500 mb-5">للوظيفة: <span className="font-semibold text-gray-700">{job.jobTitle}</span> — لا حاجة لإنشاء حساب.</p>
        <form onSubmit={submit} className="space-y-4">
          <div>
            <label className="block text-sm font-medium mb-1.5">اسم المتقدم</label>
            <input ref={inputRef} value={name} onChange={e=>setName(e.target.value)} placeholder="أدخل اسمك الكامل"
              className={"w-full rounded-xl border px-4 py-2.5 text-sm " + (errors.name?"border-red-400":"border-gray-200")}/>
            {errors.name && <p className="text-xs text-red-500 mt-1">{errors.name}</p>}
          </div>
          <div>
            <label className="block text-sm font-medium mb-1.5">رقم الهاتف</label>
            <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="أدخل رقم هاتفك" dir="ltr"
              className={"w-full rounded-xl border px-4 py-2.5 text-sm text-right " + (errors.phone?"border-red-400":"border-gray-200")}/>
            {errors.phone && <p className="text-xs text-red-500 mt-1">{errors.phone}</p>}
          </div>
          <button type="submit" className="btn-primary w-full rounded-xl py-3 font-bold text-sm flex items-center justify-center gap-2">
            <span>تقديم عبر واتساب</span>
            <span>💬</span>
          </button>
          <p className="text-[11px] text-gray-400 text-center">سيتم فتح واتساب برسالة جاهزة تحتوي بيانات الوظيفة وبياناتك لإرسالها إلى فريق التوظيف.</p>
        </form>
      </div>
    </div>
  );
}

function JobsPage({go, initialFilters}){

  const [expLevel,setExpLevel] = useState('');

  const results = useMemo(()=>{
    return jobs.filter(j=>{
      if(j.status !== 'published') return false;
      const q = query.trim().toLowerCase();
      const matchesQuery = !q || [j.jobTitle, j.organizationName, j.description, ...(j.skills||[])].join(' ').toLowerCase().includes(q);
      return matchesQuery
        && (!category || j.category===category)
        && (!city || j.city===city)
        && (!workMode || j.workMode===workMode)
        && (!jobType || j.jobType===jobType)
        && (!expLevel || j.experienceLevel===expLevel);
    });
  },[jobs,query,category,city,workMode,jobType,expLevel]);

  const FilterSelect = ({label, value, onChange, options}) => (
    <div>
      <label className="block text-xs font-semibold text-gray-500 mb-1.5">{label}</label>
      <select value={value} onChange={e=>onChange(e.target.value)} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white">

        {options.map(o=><option key={o} value={o}>{o}</option>)}

  return (
    <div className="max-w-7xl mx-auto px-4 md:px-8 py-10">
      <div className="mb-8">
        <h1 className="font-display text-2xl font-extrabold mb-1" style={{color:'var(--teal-900)'}}>كل الوظائف</h1>

            <label className="block text-xs font-semibold text-gray-500 mb-1.5">بحث</label>

          <FilterSelect label="المدينة" value={city} onChange={setCity} options={cities.map(c=>c.name)}/>
          <FilterSelect label="نظام العمل" value={workMode} onChange={setWorkMode} options={WORK_MODES}/>
          <FilterSelect label="نوع الوظيفة" value={jobType} onChange={setJobType} options={JOB_TYPES}/>
          <FilterSelect label="مستوى الخبرة" value={expLevel} onChange={setExpLevel} options={EXP_LEVELS}/>
          {(category||city||workMode||jobType||expLevel||query) &&
            <button onClick={()=>{setQuery('');setCategory('');setCity('');setWorkMode('');setJobType('');setExpLevel('');}}

const DEMO_ACCOUNTS = {
  main: {email:"admin@arzaq.com", password:"admin123", label:"المشرف الرئيسي"},
  ads:  {email:"ads@arzaq.com", password:"ads123", label:"مشرف الإعلانات"},
};

function AdminLogin({role, onSuccess, go}){
  const account = DEMO_ACCOUNTS[role];
  const [email,setEmail] = useState('');
  const [password,setPassword] = useState('');
  const [error,setError] = useState('');

  function submit(e){
    e.preventDefault();
    if(email.trim()===account.email && password===account.password){
      setError('');
      onSuccess();
    } else {
      setError('البريد الإلكتروني أو كلمة المرور غير صحيحة.');
    }
  }

  return (
    <div className="min-h-screen flex items-center justify-center admin-shell px-4">
      <div className="w-full max-w-sm">
        <button onClick={()=>go('home')} className="mb-6 flex justify-center w-full"><Logo/></button>

          <h1 className="font-display font-bold text-lg mb-1" style={{color:'var(--teal-900)'}}>{role==='ads' ? 'دخول لوحة الإعلانات' : 'دخول لوحة الإدارة'}</h1>
          <p className="text-xs text-gray-400 mb-6">مصادقة عبر Firebase Authentication ({account.label} فقط)</p>
          <form onSubmit={submit} className="space-y-4">
            <div>
              <label className="block text-sm font-medium mb-1.5">البريد الإلكتروني</label>
              <input value={email} onChange={e=>setEmail(e.target.value)} dir="ltr" className="w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm text-left" placeholder="name@arzaq.com"/>
            </div>
            <div>
              <label className="block text-sm font-medium mb-1.5">كلمة المرور</label>
              <input type="password" value={password} onChange={e=>setPassword(e.target.value)} dir="ltr" className="w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm text-left" placeholder="••••••••"/>
            </div>
            {error && <p className="text-xs text-red-500">{error}</p>}

  );
}

function JobFormModal({initial, onClose, onSave}){
  const {categories, cities, organizations} = useData();
  const blank = {jobTitle:'', organizationName:'', organizationLogo:'🏢', category:categories[0]?.name||'', city:cities[0]?.name||'', workMode:WORK_MODES[0], jobType:JOB_TYPES[0], experienceLevel:EXP_LEVELS[0], salary:'', description:'', responsibilities:'', requirements:'', skills:'', languages:'', benefits:'', publishDate: todayISO(), expiryDate:'', featured:false, status:'published'};
  const toForm = (j) => j ? {...j, responsibilities:(j.responsibilities||[]).join('\n'), requirements:(j.requirements||[]).join('\n'), skills:(j.skills||[]).join(', '), languages:(j.languages||[]).join(', '), benefits:(j.benefits||[]).join('\n')} : blank;
  const [form,setForm] = useState(toForm(initial));
  const set = (k,v) => setForm(prev=>({...prev,[k]:v}));

  function submit(e){
    e.preventDefault();
    if(!form.jobTitle.trim() || !form.organizationName.trim()) return;
    const org = organizations.find(o=>o.name===form.organizationName);
    const payload = {
      ...form,
      organizationLogo: org ? org.logo : form.organizationLogo,
      responsibilities: form.responsibilities.split('\n').map(s=>s.trim()).filter(Boolean),
      requirements: form.requirements.split('\n').map(s=>s.trim()).filter(Boolean),
      benefits: form.benefits.split('\n').map(s=>s.trim()).filter(Boolean),
      skills: form.skills.split(',').map(s=>s.trim()).filter(Boolean),
      languages: form.languages.split(',').map(s=>s.trim()).filter(Boolean),
    };
    onSave(payload);
  }

  const Field = ({label, children}) => (<div><label className="block text-xs font-semibold text-gray-500 mb-1.5">{label}</label>{children}</div>);
  const inputCls = "w-full border border-gray-200 rounded-lg px-3 py-2 text-sm";

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4" onClick={onClose}>
      <div className="bg-white w-full max-w-3xl max-h-[90vh] overflow-y-auto rounded-2xl p-6 fade-up" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-5">
          <h3 className="font-display font-bold text-lg" style={{color:'var(--teal-900)'}}>{initial ? 'تعديل الوظيفة' : 'إضافة وظيفة جديدة'}</h3>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-700 text-xl leading-none">×</button>
        </div>
        <form onSubmit={submit} className="space-y-5">
          <div className="grid md:grid-cols-2 gap-4">
            <Field label="اسم الوظيفة"><input required value={form.jobTitle} onChange={e=>set('jobTitle',e.target.value)} className={inputCls}/></Field>
            <Field label="الجهة">
              <select required value={form.organizationName} onChange={e=>set('organizationName',e.target.value)} className={inputCls}>
                <option value="">اختر الجهة</option>
                {organizations.map(o=><option key={o.id} value={o.name}>{o.name}</option>)}
              </select>
            </Field>
            <Field label="التصنيف"><select value={form.category} onChange={e=>set('category',e.target.value)} className={inputCls}>{categories.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}</select></Field>
            <Field label="المدينة"><select value={form.city} onChange={e=>set('city',e.target.value)} className={inputCls}>{cities.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}</select></Field>
            <Field label="نظام العمل"><select value={form.workMode} onChange={e=>set('workMode',e.target.value)} className={inputCls}>{WORK_MODES.map(o=><option key={o}>{o}</option>)}</select></Field>
            <Field label="نوع الوظيفة"><select value={form.jobType} onChange={e=>set('jobType',e.target.value)} className={inputCls}>{JOB_TYPES.map(o=><option key={o}>{o}</option>)}</select></Field>
            <Field label="مستوى الخبرة"><select value={form.experienceLevel} onChange={e=>set('experienceLevel',e.target.value)} className={inputCls}>{EXP_LEVELS.map(o=><option key={o}>{o}</option>)}</select></Field>
            <Field label="الراتب (اختياري)"><input value={form.salary} onChange={e=>set('salary',e.target.value)} className={inputCls}/></Field>
            <Field label="تاريخ النشر"><input type="date" value={form.publishDate} onChange={e=>set('publishDate',e.target.value)} className={inputCls}/></Field>
            <Field label="آخر موعد للتقديم"><input type="date" value={form.expiryDate} onChange={e=>set('expiryDate',e.target.value)} className={inputCls}/></Field>
          </div>
          <Field label="وصف الوظيفة"><textarea required rows="3" value={form.description} onChange={e=>set('description',e.target.value)} className={inputCls}></textarea></Field>
          <div className="grid md:grid-cols-2 gap-4">
            <Field label="المسؤوليات (سطر لكل عنصر)"><textarea rows="3" value={form.responsibilities} onChange={e=>set('responsibilities',e.target.value)} className={inputCls}></textarea></Field>
            <Field label="المؤهلات (سطر لكل عنصر)"><textarea rows="3" value={form.requirements} onChange={e=>set('requirements',e.target.value)} className={inputCls}></textarea></Field>
            <Field label="المميزات (سطر لكل عنصر)"><textarea rows="3" value={form.benefits} onChange={e=>set('benefits',e.target.value)} className={inputCls}></textarea></Field>
            <div className="space-y-4">
              <Field label="المهارات (مفصولة بفاصلة)"><input value={form.skills} onChange={e=>set('skills',e.target.value)} className={inputCls}/></Field>
              <Field label="اللغات (مفصولة بفاصلة)"><input value={form.languages} onChange={e=>set('languages',e.target.value)} className={inputCls}/></Field>
            </div>
          </div>
          <div className="flex flex-wrap items-center gap-6 pt-2">
            <label className="flex items-center gap-2 text-sm font-medium"><input type="checkbox" checked={form.featured} onChange={e=>set('featured',e.target.checked)}/> وظيفة مميزة</label>
            <div className="flex items-center gap-2 text-sm font-medium">
              الحالة:
              <select value={form.status} onChange={e=>set('status',e.target.value)} className="border border-gray-200 rounded-lg px-2 py-1.5 text-sm">
                {JOB_STATUSES.map(s=><option key={s} value={s}>{STATUS_LABEL[s]}</option>)}
              </select>
            </div>
          </div>
          <div className="flex gap-3 pt-2">
            <button type="submit" className="btn-primary rounded-xl px-6 py-2.5 font-bold text-sm">{initial ? 'حفظ التعديلات' : 'إضافة الوظيفة'}</button>
            <button type="button" onClick={onClose} className="btn-outline rounded-xl px-6 py-2.5 font-bold text-sm">إلغاء</button>
          </div>
        </form>
      </div>
    </div>
  );
}

          <div key={o.id} className="card rounded-2xl p-5">
            <div className="flex items-center gap-3 mb-3"><div className="w-11 h-11 rounded-xl flex items-center justify-center text-xl" style={{background:'var(--teal-100)'}}>{o.logo}</div><div className="font-bold text-sm" style={{color:'var(--teal-900)'}}>{o.name}</div></div>
            <p className="text-xs text-gray-500 mb-4 leading-relaxed line-clamp-3">{o.description}</p>
            <div className="flex gap-2"><button onClick={()=>{setEditing(o); setShowForm(true);}} className="btn-outline text-xs font-semibold px-3 py-1.5 rounded-lg">تعديل</button><ConfirmDeleteButton onConfirm={()=>deleteOrganization(o.id)}/></div>
          </div>
        ))}
      </div>
      {showForm && <OrgFormModal initial={editing} onClose={()=>setShowForm(false)} onSave={(data)=>{ editing ? updateOrganization(editing.id, data) : addOrganization(data); setShowForm(false); }}/>}
    </div>
  );
}

function AdminDashboard(){
  const {jobs, organizations, categories} = useData();
  const published = jobs.filter(j=>j.status==='published').length;
  const featured = jobs.filter(j=>j.featured).length;
  return (
    <div>
      <h2 className="font-display text-xl font-extrabold mb-5" style={{color:'var(--teal-900)'}}>نظرة عامة</h2>
      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <StatCard label="إجمالي الوظائف" value={jobs.length} icon="📋"/>
        <StatCard label="وظائف منشورة" value={published} icon="✅"/>
        <StatCard label="وظائف مميزة" value={featured} icon="⭐"/>
        <StatCard label="الجهات المسجّلة" value={organizations.length} icon="🏢"/>
      </div>
      <div className="card rounded-2xl p-5">
        <h3 className="font-bold text-sm mb-3 text-gray-700">توزيع الوظائف حسب التصنيف</h3>
        <div className="space-y-2">
          {categories.map(c=>{
            const count = jobs.filter(j=>j.category===c.name).length;
            const pct = jobs.length ? Math.round((count/jobs.length)*100) : 0;
            return (
              <div key={c.id} className="flex items-center gap-3 text-xs">
                <span className="w-32 shrink-0 text-gray-500">{c.name}</span>
                <div className="flex-1 h-2 rounded-full bg-gray-100 overflow-hidden"><div className="h-full rounded-full" style={{width:pct+'%', background:'var(--teal)'}}></div></div>
                <span className="w-6 text-gray-400">{count}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function MainAdminApp({go}){
  const [active,setActive] = useState('dashboard');
  const items = [
    {id:'dashboard', label:'نظرة عامة', icon:'📊'},
    {id:'jobs', label:'الوظائف', icon:'📋'},
    {id:'organizations', label:'الجهات والشركات', icon:'🏢'},
    {id:'categories', label:'التصنيفات', icon:'🏷️'},
    {id:'cities', label:'المدن', icon:'📍'},
  ];
  const {categories, cities, addCategory, deleteCategory, addCity, deleteCity} = useData();

  return (
    <div className="admin-shell flex" dir="rtl">
      <AdminSidebar items={items} active={active} setActive={setActive} title="لوحة المشرف الرئيسي" onLogout={()=>go('home')}/>
      <main className="flex-1 p-6 md:p-8 max-w-6xl">
        {active==='dashboard' && <AdminDashboard/>}
        {active==='jobs' && <AdminJobsManager/>}
        {active==='organizations' && <AdminOrganizationsManager/>}
        {active==='categories' && <SimpleListManager title="التصنيفات" items={categories} onAdd={addCategory} onDelete={deleteCategory} placeholder="اسم تصنيف جديد"/>}
        {active==='cities' && <SimpleListManager title="المدن" items={cities} onAdd={addCity} onDelete={deleteCity} placeholder="اسم مدينة جديدة"/>}
      </main>
    </div>
  );
}

/* ---------- Ads Admin ---------- */
function AdFormModal({initial, onClose, onSave}){
  const [form,setForm] = useState(initial || {title:'', imageUrl:'', targetUrl:'', active:true, startDate:todayISO(), endDate:''});
  const set=(k,v)=>setForm(prev=>({...prev,[k]:v}));
  function submit(e){ e.preventDefault(); if(!form.title.trim()) return; onSave(form); }
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4" onClick={onClose}>
      <div className="bg-white w-full max-w-md rounded-2xl p-6 fade-up" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-5"><h3 className="font-display font-bold text-lg" style={{color:'var(--teal-900)'}}>{initial ? 'تعديل الإعلان' : 'إضافة إعلان جديد'}</h3><button onClick={onClose} className="text-gray-400 text-xl leading-none">×</button></div>
        <form onSubmit={submit} className="space-y-4">
          <div><label className="block text-xs font-semibold text-gray-500 mb-1.5">عنوان الإعلان</label><input required value={form.title} onChange={e=>set('title',e.target.value)} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"/></div>
          <div><label className="block text-xs font-semibold text-gray-500 mb-1.5">رابط الصورة (Firebase Storage)</label><input value={form.imageUrl} onChange={e=>set('imageUrl',e.target.value)} dir="ltr" placeholder="https://..." className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-left"/></div>
          <div><label className="block text-xs font-semibold text-gray-500 mb-1.5">رابط الوجهة عند النقر</label><input value={form.targetUrl} onChange={e=>set('targetUrl',e.target.value)} dir="ltr" placeholder="https://..." className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-left"/></div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="block text-xs font-semibold text-gray-500 mb-1.5">تاريخ البدء</label><input type="date" value={form.startDate} onChange={e=>set('startDate',e.target.value)} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"/></div>
            <div><label className="block text-xs font-semibold text-gray-500 mb-1.5">تاريخ الانتهاء</label><input type="date" value={form.endDate} onChange={e=>set('endDate',e.target.value)} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"/></div>
          </div>
          <label className="flex items-center gap-2 text-sm font-medium"><input type="checkbox" checked={form.active} onChange={e=>set('active',e.target.checked)}/> إعلان نشط</label>
          <div className="flex gap-3 pt-1"><button type="submit" className="btn-primary rounded-xl px-6 py-2.5 font-bold text-sm">حفظ</button><button type="button" onClick={onClose} className="btn-outline rounded-xl px-6 py-2.5 font-bold text-sm">إلغاء</button></div>
        </form>
      </div>
    </div>
  );
}

function AdsManager(){
  const {ads, addAd, updateAd, deleteAd} = useData();
  const [showForm,setShowForm] = useState(false);
  const [editing,setEditing] = useState(null);
  return (
    <div>
      <div className="flex items-center justify-between mb-5">
        <div><h2 className="font-display text-xl font-extrabold" style={{color:'var(--teal-900)'}}>الإعلانات</h2><p className="text-xs text-gray-400 mt-1">إدارة الإعلانات المعروضة على المنصة</p></div>
        <button onClick={()=>{setEditing(null); setShowForm(true);}} className="btn-primary rounded-lg px-4 py-2 text-sm font-bold">+ إضافة إعلان</button>
      </div>
      <div className="card rounded-2xl overflow-x-auto">
        <table className="w-full admin-table text-sm">
          <thead><tr><th>العنوان</th><th>الفترة</th><th>الحالة</th><th>إجراءات</th></tr></thead>
          <tbody>
            {ads.map(a=>(
              <tr key={a.id}>
                <td className="font-semibold text-gray-700">{a.title}</td>
                <td className="text-gray-400 text-xs">{a.startDate} → {a.endDate || '—'}</td>
                <td><div onClick={()=>updateAd(a.id,{active:!a.active})} className={"switch " + (a.active?"on":"off")}></div></td>
                <td><div className="flex items-center gap-1.5"><button onClick={()=>{setEditing(a); setShowForm(true);}} className="btn-outline text-xs font-semibold px-2.5 py-1.5 rounded-lg">تعديل</button><ConfirmDeleteButton onConfirm={()=>deleteAd(a.id)}/></div></td>
              </tr>
            ))}
            {ads.length===0 && <tr><td colSpan="4" className="text-center text-gray-400 py-10">لا توجد إعلانات بعد</td></tr>}
          </tbody>
        </table>
      </div>
      {showForm && <AdFormModal initial={editing} onClose={()=>setShowForm(false)} onSave={(data)=>{ editing ? updateAd(editing.id, data) : addAd(data); setShowForm(false); }}/>}
    </div>
  );
}

const AD_PAGES = ["الرئيسية","صفحة الوظيفة","صفحة كل الوظائف","التصنيفات"];
const AD_POSITIONS = ["أعلى الصفحة","الشريط الجانبي","أسفل الصفحة","بين النتائج"];

function PlacementFormModal({onClose, onSave, ads}){
  const [form,setForm] = useState({adId: ads[0]?.id || '', page: AD_PAGES[0], position: AD_POSITIONS[0], priority: 1});
  const set=(k,v)=>setForm(prev=>({...prev,[k]:v}));
  function submit(e){ e.preventDefault(); if(!form.adId) return; onSave(form); }
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4" onClick={onClose}>
      <div className="bg-white w-full max-w-md rounded-2xl p-6 fade-up" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-5"><h3 className="font-display font-bold text-lg" style={{color:'var(--teal-900)'}}>إضافة موضع إعلاني</h3><button onClick={onClose} className="text-gray-400 text-xl leading-none">×</button></div>
        <form onSubmit={submit} className="space-y-4">
          <div><label className="block text-xs font-semibold text-gray-500 mb-1.5">الإعلان</label><select value={form.adId} onChange={e=>set('adId',e.target.value)} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">{ads.map(a=><option key={a.id} value={a.id}>{a.title}</option>)}</select></div>
          <div><label className="block text-xs font-semibold text-gray-500 mb-1.5">الصفحة</label><select value={form.page} onChange={e=>set('page',e.target.value)} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">{AD_PAGES.map(p=><option key={p}>{p}</option>)}</select></div>
          <div><label className="block text-xs font-semibold text-gray-500 mb-1.5">الموضع</label><select value={form.position} onChange={e=>set('position',e.target.value)} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">{AD_POSITIONS.map(p=><option key={p}>{p}</option>)}</select></div>
          <div><label className="block text-xs font-semibold text-gray-500 mb-1.5">الأولوية</label><input type="number" min="1" value={form.priority} onChange={e=>set('priority',Number(e.target.value))} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"/></div>
          <div className="flex gap-3 pt-1"><button type="submit" className="btn-primary rounded-xl px-6 py-2.5 font-bold text-sm">حفظ</button><button type="button" onClick={onClose} className="btn-outline rounded-xl px-6 py-2.5 font-bold text-sm">إلغاء</button></div>
        </form>
      </div>
    </div>
  );
}

function PlacementsManager(){
  const {ads, placements, addPlacement, deletePlacement} = useData();
  const [showForm,setShowForm] = useState(false);
  return (
    <div>
      <div className="flex items-center justify-between mb-5">
        <div><h2 className="font-display text-xl font-extrabold" style={{color:'var(--teal-900)'}}>مواضع الإعلانات</h2><p className="text-xs text-gray-400 mt-1">تحديد أين وبأي أولوية يظهر كل إعلان</p></div>
        <button disabled={ads.length===0} onClick={()=>setShowForm(true)} className="btn-primary rounded-lg px-4 py-2 text-sm font-bold disabled:opacity-40">+ إضافة موضع</button>
      </div>
      <div className="card rounded-2xl overflow-x-auto">
        <table className="w-full admin-table text-sm">
          <thead><tr><th>الإعلان</th><th>الصفحة</th><th>الموضع</th><th>الأولوية</th><th>إجراءات</th></tr></thead>
          <tbody>
            {placements.map(p=>{
              const ad = ads.find(a=>a.id===p.adId);
              return (
                <tr key={p.id}>
                  <td className="font-semibold text-gray-700">{ad ? ad.title : '—'}</td>
                  <td className="text-gray-500">{p.page}</td>
                  <td className="text-gray-500">{p.position}</td>
                  <td className="text-gray-400">{p.priority}</td>
                  <td><ConfirmDeleteButton onConfirm={()=>deletePlacement(p.id)}/></td>
                </tr>
              );
            })}
            {placements.length===0 && <tr><td colSpan="5" className="text-center text-gray-400 py-10">لا توجد مواضع إعلانية بعد</td></tr>}
          </tbody>
        </table>
      </div>
      {showForm && <PlacementFormModal ads={ads} onClose={()=>setShowForm(false)} onSave={(data)=>{ addPlacement(data); setShowForm(false); }}/>}
    </div>
  );
}

function AdsAdminDashboard(){
  const {ads, placements} = useData();
  const active = ads.filter(a=>a.active).length;
  return (
    <div>
      <h2 className="font-display text-xl font-extrabold mb-5" style={{color:'var(--teal-900)'}}>نظرة عامة على الإعلانات</h2>
      <div className="grid sm:grid-cols-3 gap-4">
        <StatCard label="إجمالي الإعلانات" value={ads.length} icon="📢"/>
        <StatCard label="إعلانات نشطة" value={active} icon="🟢"/>
        <StatCard label="مواضع معرّفة" value={placements.length} icon="📌"/>
      </div>
    </div>
  );
}

function AdsAdminApp({go}){
  const [active,setActive] = useState('dashboard');
  const items = [
    {id:'dashboard', label:'نظرة عامة', icon:'📊'},
    {id:'ads', label:'الإعلانات', icon:'📢'},
    {id:'placements', label:'مواضع العرض', icon:'📌'},
  ];
  return (
    <div className="admin-shell flex" dir="rtl">
      <AdminSidebar items={items} active={active} setActive={setActive} title="لوحة مشرف الإعلانات" onLogout={()=>go('home')}/>
      <main className="flex-1 p-6 md:p-8 max-w-6xl">
        {active==='dashboard' && <AdsAdminDashboard/>}
        {active==='ads' && <AdsManager/>}
        {active==='placements' && <PlacementsManager/>}
      </main>
    </div>
  );
}

function AdminGate({role, go}){
  const [authed,setAuthed] = useState(false);
  if(!authed) return <AdminLogin role={role} go={go} onSuccess={()=>setAuthed(true)}/>;
  return role==='ads' ? <AdsAdminApp go={go}/> : <MainAdminApp go={go}/>;
}

/* =========================================================================
   APP ROOT
   ========================================================================= */
function AppShell(){
  const [page,setPage] = useState('home');
  const [jobSlug,setJobSlug] = useState(null);
  const [jobsFilter,setJobsFilter] = useState(null);

  function go(target, slug, filters){
    setPage(target);
    if(slug) setJobSlug(slug);
    if(filters) setJobsFilter(filters); else if(target==='jobs' && !filters) setJobsFilter(null);
    window.scrollTo({top:0, behavior:'smooth'});
  }

  if(page==='admin') return <AdminGate role="main" go={go}/>;
  if(page==='ads-admin') return <AdminGate role="ads" go={go}/>;

  let content;
  if(page==='home') content = <HomePage go={go}/>;
  else if(page==='jobs') content = <JobsPage go={go} initialFilters={jobsFilter}/>;
  else if(page==='job') content = <JobPage slug={jobSlug} go={go}/>;
  else if(page==='categories') content = <CategoriesPage go={go}/>;
  else if(page==='cities') content = <CitiesPage go={go}/>;
  else if(page==='remote') content = <RemotePage go={go}/>;
  else if(page==='about') content = <AboutPage/>;
  else if(page==='contact') content = <ContactPage/>;

  return (
    <div className="min-h-screen flex flex-col">
      <Header go={go} current={page}/>
      <main className="flex-1">{content}</main>
      <Footer go={go}/>
    </div>
  );
}

function App(){
  return (<DataProvider><AppShell/></DataProvider>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
